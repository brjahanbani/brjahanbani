<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Babak (Bob) Rad Jahanbani — I build online stores that actually drive sales. E-BEY, Istanbul.">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#D4A84B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#D4A84B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8C6A22"/>
      <stop offset="0.45" stop-color="#F6DE9C"/>
      <stop offset="0.55" stop-color="#F6DE9C"/>
      <stop offset="1" stop-color="#8C6A22"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}
      .up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
      .d1{animation-delay:.15s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
      @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
      .pulse{transform-origin:68px 250px;animation:pulse 1.8s ease-out infinite}
      @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
      .ticker{animation:tick 38s linear infinite}
      @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-1800px)}}
      .caret{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0A0E16"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- big monogram -->
    <text x="1150" y="215" text-anchor="end" class="sans" font-size="104" font-weight="800" letter-spacing="4" fill="none" stroke="url(#shine)" stroke-width="1.6" opacity="0.9">E·BEY</text>

    <!-- header row -->
    <text x="56" y="56" class="mono up" font-size="13" letter-spacing="2.5" fill="#D4A84B">00 — SIGNAL / OVERVIEW</text>
    <text x="1144" y="56" text-anchor="end" class="mono up" font-size="13" letter-spacing="2" fill="#8A94A6">ISTANBUL · 41.0°N 28.9°E</text>

    <text x="56" y="118" class="sans up d1" font-size="44" font-weight="700" fill="#F3F5F9">Babak (Bob) Rad Jahanbani</text>
    <text x="56" y="166" class="sans up d2" font-size="29" font-weight="400" fill="#C9D1DD">I build online stores that actually <tspan fill="#F1D58A" font-weight="700">drive sales.</tspan></text>
    <text x="56" y="206" class="sans up d3" font-size="17" fill="#8A94A6">Full-Stack Developer · E-Commerce Manager · Product Owner — independent under <tspan fill="#E8ECF3" font-weight="600">E-BEY</tspan></text>

    <!-- status pill -->
    <g class="up d4">
      <rect x="50" y="232" width="330" height="36" rx="18" fill="#3DDC97" fill-opacity="0.08" stroke="#3DDC97" stroke-opacity="0.35"/>
      <circle class="pulse" cx="68" cy="250" r="5" fill="#3DDC97"/>
      <circle cx="68" cy="250" r="5" fill="#3DDC97"/>
      <text x="84" y="255" class="mono" font-size="13" letter-spacing="1.5" fill="#BFF5DC">8 PLATFORMS LAUNCHED · 2026</text>
    </g>
    <g class="up d5">
      <rect x="392" y="232" width="248" height="36" rx="18" fill="#D4A84B" fill-opacity="0.08" stroke="#D4A84B" stroke-opacity="0.4"/>
      <text x="516" y="255" text-anchor="middle" class="mono" font-size="13" letter-spacing="1.5" fill="#F1D58A">10+ YRS · 30+ PLATFORMS</text>
    </g>

    <!-- ticker -->
    <rect y="292" width="1200" height="48" fill="#D4A84B" fill-opacity="0.07"/>
    <line x1="0" y1="292" x2="1200" y2="292" stroke="#D4A84B" stroke-opacity="0.35"/>
    <g class="ticker">
      <text x="0" y="322" class="mono" font-size="14" letter-spacing="2" fill="#D9C08A" textLength="1800" lengthAdjust="spacingAndGlyphs">E-COMMERCE MANAGEMENT  //  FULL-STACK WEB DEVELOPMENT  //  SYSTEM ANALYSIS  //  PRODUCT OWNERSHIP  //  KANBAN &amp; CRM APPS  //  REAL-TIME GOLD PRICING  //  PAYMENT INTEGRATION  //  UI / UX DESIGN  //  </text>
      <text x="1800" y="322" class="mono" font-size="14" letter-spacing="2" fill="#D9C08A" textLength="1800" lengthAdjust="spacingAndGlyphs">E-COMMERCE MANAGEMENT  //  FULL-STACK WEB DEVELOPMENT  //  SYSTEM ANALYSIS  //  PRODUCT OWNERSHIP  //  KANBAN &amp; CRM APPS  //  REAL-TIME GOLD PRICING  //  PAYMENT INTEGRATION  //  UI / UX DESIGN  //  </text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#D4A84B" stroke-opacity="0.25"/>
</svg>
