  <text x="32" y="36" class="mono" font-size="12" letter-spacing="2.5" fill="#D4A84B">02 — CAREER / SIGNAL PATH</text>
  <text x="1168" y="36" text-anchor="end" class="mono" font-size="12" letter-spacing="2" fill="#8A94A6">TABRIZ → TEHRAN → ISTANBUL → NORDICS</text>
