<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Career timeline from 2007 to a 2027 PhD, ending at E-BEY in Istanbul.">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B5320"/><stop offset="0.75" stop-color="#D4A84B"/><stop offset="1" stop-color="#3DDC97"/>
    </linearGradient>
    <style>
      .sans{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,'DejaVu Sans Mono',monospace}
      .draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.4s cubic-bezier(.4,0,.2,1) .2s forwards}
      @keyframes draw{to{stroke-dashoffset:0}}
      .n{opacity:0;animation:pop .6s ease-out forwards}
      @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      .fut{opacity:0;animation:pop .6s ease-out 2.4s forwards}
      .pulse{animation:pulse 1.8s ease-out 2.4s infinite;opacity:0}
      @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
    </style>
